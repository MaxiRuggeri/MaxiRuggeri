      font-size: 52px;
      letter-spacing: 6px;
      fill: #f0fdf4;
      stroke: #059669;
      stroke-width: 0.8px;
      stroke-linejoin: round;
      stroke-linecap: round;
      paint-order: stroke fill;
      filter: url(#neonGreenGlow);
    }

    .c-M  { display: inline-block; animation: fastSnapM 18.0s infinite linear; }
