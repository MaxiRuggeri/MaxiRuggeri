<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e061c">
        <animate attributeName="stop-color" values="#0e061c; #15082a; #0a0414; #0e061c" dur="18s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1a0933">
        <animate attributeName="stop-color" values="#1a0933; #240b44; #140728; #1a0933" dur="18s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#080212">
        <animate attributeName="stop-color" values="#080212; #0e031e; #06010e; #080212" dur="18s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="waveGradient1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.38">
        <animate attributeName="stop-color" values="#7c3aed; #9333ea; #6d28d9; #7c3aed" dur="16s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.45">
        <animate attributeName="stop-color" values="#a855f7; #c084fc; #8b5cf6; #a855f7" dur="16s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.32">
        <animate attributeName="stop-color" values="#6b21a8; #7e22ce; #581c87; #6b21a8" dur="16s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="waveGradient2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.35">
        <animate attributeName="stop-color" values="#581c87; #6b21a8; #4c1d95; #581c87" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.32">
        <animate attributeName="stop-color" values="#9333ea; #a855f7; #7e22ce; #9333ea" dur="14s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.35">
        <animate attributeName="stop-color" values="#4c1d95; #581c87; #3b0764; #4c1d95" dur="14s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="fadeGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="82%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <mask id="bottomFadeMask">
      <rect width="854" height="220" fill="url(#fadeGradient)" />
    </mask>

    <filter id="neonGreenGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feGaussianBlur stdDeviation="16" result="blur3" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.10
        0 0 0 0 0.85
        0 0 0 0 0.40
        0 0 0 1 0" in="blur3" result="greenBlur3" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.15
        0 0 0 0 0.95
        0 0 0 0 0.50
        0 0 0 1 0" in="blur2" result="greenBlur2" />
      <feMerge>
        <feMergeNode in="greenBlur3" />
        <feMergeNode in="greenBlur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

