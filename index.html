<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tela Interactiva</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: rgb(5, 7, 12);
            font-family: sans-serif;
            color: white;
        }
        canvas {
            display: none;
            touch-action: none; 
        }
        
        #pantallaInicio {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgb(10, 15, 25);
            z-index: 50;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .tarjeta {
            background-color: rgba(20, 30, 45, 0.9);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid rgb(0, 255, 150);
            box-shadow: 0 10px 30px rgba(0,255,150,0.2);
            max-width: 400px;
            width: 100%;
            max-height: 95vh;
            overflow-y: auto;
        }
        h2 { margin-top: 0; color: rgb(0, 255, 150); }
        .grupo-entrada {
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }
        select, input[type="file"] {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.2);
        }
        select option {
            background-color: rgb(20, 30, 45);
            color: white;
        }
        input[type="color"] {
            width: 100%;
            height: 45px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        input[type="range"] {
            accent-color: rgb(0, 255, 150);
            width: 100%;
            cursor: pointer;
        }
        .etiqueta-deslizador {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        .btn-iniciar {
            background-color: rgb(0, 255, 150);
            color: rgb(5, 7, 12);
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: transform 0.1s;
        }
        .btn-iniciar:active { transform: scale(0.95); }

        #btnModo {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            background-color: rgb(0, 255, 150);
            color: rgb(0, 5, 10);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
            cursor: pointer;
        }
        .texto-advertencia {
            color: #ff4444;
            font-size: 11px;
            font-weight: bold;
            display: none;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div id="pantallaInicio">
        <div class="tarjeta">
            <h2>Diseña tu Tela</h2>
            
            <div class="grupo-entrada">
                <div class="etiqueta-deslizador">
                    <span>Resolución:</span>
                    <span id="valorPoligonos" style="font-weight:bold;">Media (20)</span>
                </div>
                <input type="range" id="sliderPoligonos" min="10" max="150" value="20">
                <span id="advertenciaLag" class="texto-advertencia">⚠️ CUIDADO: Valores extremos pueden trabar tu dispositivo.</span>
            </div>

            <div class="grupo-entrada">
                <label>Estilo Visual:</label>
                <select id="selectorEstiloRender">
                    <option value="solido">Cuadros Rellenos (Sólido)</option>
                    <option value="alambre">Malla de Alambre (Líneas)</option>
                </select>
            </div>

            <div class="grupo-entrada">
                <label>Color Base:</label>
                <input type="color" id="selectorColor" value="#9654ff">
            </div>

            <div style="margin: 15px 0; text-align: center; color: #888; font-size: 12px;">--- O ---</div>

            <div class="grupo-entrada">
                <label>Estampar Imagen (Se ajusta sola):</label>
                <input type="file" id="selectorImagen" accept="image/*">
            </div>

            <button class="btn-iniciar" id="btnIniciar">Iniciar Simulación 🚀</button>
        </div>
    </div>

    <canvas id="lienzo"></canvas>
    <button id="btnModo">Modo: Arrastrar 🖐️</button>

    <script>
        const pantallaInicio = document.getElementById('pantallaInicio');
        const btnIniciar = document.getElementById('btnIniciar');
        const selectorColor = document.getElementById('selectorColor');
        const selectorImagen = document.getElementById('selectorImagen');
        const selectorEstiloRender = document.getElementById('selectorEstiloRender');
        const lienzo = document.getElementById('lienzo');
        const btnModo = document.getElementById('btnModo');
        const sliderPoligonos = document.getElementById('sliderPoligonos');
        const valorPoligonos = document.getElementById('valorPoligonos');
        const advertenciaLag = document.getElementById('advertenciaLag');
        const ctx = lienzo.getContext('2d');

        let imagenTela = null; 
        let colorBaseTela = {r: 150, g: 84, b: 255}; 
        let modoRenderizado = 'solido'; 
        let estaSimulando = false;

        const Puntos = []; 
        const Enlaces = []; 
        let EnlacesH = []; 
        let EnlacesV = []; 
        
        let columnas, filas, espaciado;
        let gravedadX = 0;
        let gravedadY = 0.5; 

        let estaTocando = false;
        let toqueX = -1000, toqueY = -1000;
        let modoCorte = false;

        function hexARgb(hex) {
            let entero = parseInt(hex.replace('#', ''), 16);
            return { r: (entero >> 16) & 255, g: (entero >> 8) & 255, b: entero & 255 };
        }

        sliderPoligonos.addEventListener('input', (evento) => {
            let valor = parseInt(evento.target.value);
            let etiqueta = "Media";
            
            if (valor <= 20) etiqueta = "Baja";
            else if (valor >= 100) etiqueta = "Fritapapas 💻🔥";
            else if (valor >= 70) etiqueta = "Locura";
            else if (valor >= 40) etiqueta = "Alta";

            valorPoligonos.innerText = `${etiqueta} (${valor})`;
            
            if(valor >= 80) {
                advertenciaLag.style.display = "block";
                valorPoligonos.style.color = "#ff4444";
            } else {
                advertenciaLag.style.display = "none";
                valorPoligonos.style.color = "white";
            }
        });

        btnIniciar.addEventListener('click', () => {
            modoRenderizado = selectorEstiloRender.value;
            colorBaseTela = hexARgb(selectorColor.value);

            if (selectorImagen.files && selectorImagen.files[0]) {
                const lector = new FileReader();
                lector.onload = function(evento) {
                    imagenTela = new Image();
                    imagenTela.onload = () => iniciarSimulacion();
                    imagenTela.src = evento.target.result;
                }
                lector.readAsDataURL(selectorImagen.files[0]);
            } else {
                iniciarSimulacion();
            }
        });

        function iniciarSimulacion() {
            pantallaInicio.style.display = 'none';
            lienzo.style.display = 'block';
            btnModo.style.display = 'block';
            
            lienzo.width = window.innerWidth;
            lienzo.height = window.innerHeight;

            Puntos.length = 0;
            Enlaces.length = 0;

            let divisorDensidad = parseInt(sliderPoligonos.value); 
            const anchoMaximo = lienzo.width * 0.90;
            const altoMaximo = lienzo.height * 0.80;
            
            let anchoTela = anchoMaximo;
            let altoTela = altoMaximo;

            if (imagenTela) {
                const aspectoImagen = imagenTela.width / imagenTela.height;
                const aspectoPantalla = anchoMaximo / altoMaximo;
                if (aspectoImagen > aspectoPantalla) {
                    altoTela = anchoMaximo / aspectoImagen;
                } else {
                    anchoTela = altoMaximo * aspectoImagen;
                }
            }

            columnas = divisorDensidad;
            espaciado = anchoTela / (columnas - 1);

            if (espaciado < 6) {
                espaciado = 6;
                columnas = Math.floor(anchoTela / espaciado) + 1;
            }

            filas = Math.max(2, Math.round(altoTela / espaciado) + 1);
            if (filas > 120) filas = 120;

            const inicioX = (lienzo.width - (columnas - 1) * espaciado) / 2;
            const inicioY = 20; 

            for (let y = 0; y < filas; y++) {
                for (let x = 0; x < columnas; x++) {
                    Puntos.push({
                        x: inicioX + x * espaciado,
                        y: inicioY + y * espaciado,
                        viejoX: inicioX + x * espaciado,
                        viejoY: inicioY + y * espaciado,
                        fijo: y === 0 
                    });
                }
            }

            EnlacesH = new Array(Puntos.length);
            EnlacesV = new Array(Puntos.length);

            for (let i = 0; i < Puntos.length; i++) {
                if ((i + 1) % columnas !== 0) {
                    let enlace = { p1: i, p2: i + 1, activo: true };
                    Enlaces.push(enlace);
                    EnlacesH[i] = enlace;
                }
                if (i < Puntos.length - columnas) {
                    let enlace = { p1: i, p2: i + columnas, activo: true };
                    Enlaces.push(enlace);
                    EnlacesV[i] = enlace;
                }
            }

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(estado => { 
                        if (estado === 'granted') window.addEventListener('deviceorientation', manejarOrientacion);
                        else { gravedadX = 0; gravedadY = 0.5; }
                    })
                    .catch(error => { console.error(error); gravedadX = 0; gravedadY = 0.5; });
            } else {
                window.addEventListener('deviceorientation', manejarOrientacion);
            }

            estaSimulando = true;
            bucleAnimacion();
        }

        // --- SISTEMA CORREGIDO: Giroscopio inteligente y modo reposo ---
        function manejarOrientacion(evento) {
            if (evento.gamma !== null && evento.beta !== null) {
                // Leemos la rotación real de la pantalla del celular
                let orientacion = (window.screen && window.screen.orientation) ? window.screen.orientation.angle : (window.orientation || 0);
                
                let beta = evento.beta;   // -180 a 180 (Adelante/Atrás)
                let gamma = evento.gamma; // -90 a 90   (Izquierda/Derecha)
                
                let inX = 0; 
                let inY = 0;
                
                // Transponer ejes según cómo esté rotada la pantalla (Landscape/Portrait)
                if (orientacion === 90) { 
                    inX = beta; 
                    inY = -gamma; 
                } else if (orientacion === -90 || orientacion === 270) { 
                    inX = -beta; 
                    inY = gamma; 
                } else if (orientacion === 180) { 
                    inX = -gamma; 
                    inY = -beta; 
                } else { 
                    inX = gamma; 
                    inY = beta; 
                }

                // Si el celular está acostado plano en la mesa (inclinaciones casi cero)
                // Forzamos un poco de gravedad artificial para que no flote en gravedad cero.
                if (Math.abs(inY) < 15 && Math.abs(inX) < 15) {
                    inY = 15;
                }

                inX = Math.max(-90, Math.min(90, inX));
                
                gravedadX = inX / 30; 
                gravedadY = inY / 30;
            } else {
                gravedadX = 0; 
                gravedadY = 0.5;
            }
        }

        btnModo.addEventListener('click', (evento) => {
            evento.preventDefault();
            modoCorte = !modoCorte;
            btnModo.innerText = modoCorte ? "Modo: Cortar ✂️" : "Modo: Arrastrar 🖐️";
            btnModo.style.backgroundColor = modoCorte ? "#ff4444" : "rgb(0, 255, 150)";
            btnModo.style.color = modoCorte ? "#fff" : "rgb(0, 5, 10)";
        });

        function actualizarPuntero(evento) {
            if (evento.touches && evento.touches.length > 0) {
                toqueX = evento.touches[0].clientX; 
                toqueY = evento.touches[0].clientY;
            } else {
                toqueX = evento.clientX; 
                toqueY = evento.clientY;
            }
        }

        const iniciarInteraccion = (evento) => { 
            if(!estaSimulando || evento.target !== lienzo) return;
            estaTocando = true; 
            actualizarPuntero(evento); 
        };
        const moverInteraccion = (evento) => { 
            if(!estaSimulando) return;
            if(estaTocando) actualizarPuntero(evento); 
            if (evento.cancelable && evento.target === lienzo) evento.preventDefault(); 
        };
        const terminarInteraccion = () => { estaTocando = false; toqueX = -1000; toqueY = -1000; };

        window.addEventListener('touchstart', iniciarInteraccion, {passive: false});
        window.addEventListener('touchmove', moverInteraccion, {passive: false});
        window.addEventListener('touchend', terminarInteraccion);
        window.addEventListener('mousedown', iniciarInteraccion);
        window.addEventListener('mousemove', moverInteraccion);
        window.addEventListener('mouseup', terminarInteraccion);

        function mapearTextura(ctx, img, x0, y0, u0, v0, x1, y1, u1, v1, x2, y2, u2, v2) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.closePath();
            ctx.clip(); 

            let delta = u0*v1 + v0*u2 + u1*v2 - v1*u2 - v0*u1 - u0*v2;
            if (delta !== 0) {
                let a = (x0*v1 + v0*x2 + x1*v2 - v1*x2 - v0*x1 - x0*v2) / delta;
                let b = (y0*v1 + v0*y2 + y1*v2 - v1*y2 - v0*y1 - y0*v2) / delta;
                let c = (u0*x1 + x0*u2 + u1*x2 - x1*u2 - x0*u1 - u0*x2) / delta;
                let d = (u0*y1 + y0*u2 + u1*y2 - y1*u2 - y0*u1 - u0*y2) / delta;
                let e = (u0*v1*x2 + v0*x1*u2 + x0*u1*v2 - x0*v1*u2 - v0*u1*x2 - u0*x1*v2) / delta;
                let f = (u0*v1*y2 + v0*y1*u2 + y0*u1*v2 - y0*v1*u2 - v0*u1*y2 - u0*y1*v2) / delta;
                
                ctx.transform(a, b, c, d, e, f);
                ctx.drawImage(img, 0, 0);
            }
            ctx.restore();
        }

        function bucleAnimacion() {
            if (!estaSimulando) return;

            ctx.fillStyle = 'rgb(5, 7, 12)';
            ctx.fillRect(0, 0, lienzo.width, lienzo.height);

            const limiteEstiramiento = Math.max(espaciado * 8, 45); 

            // --- SISTEMA CORREGIDO: Compensación Estructural de Peso ---
            // A mayor cantidad de filas, reducimos matemáticamente el impacto individual de la gravedad 
            // para que la suma total del peso de la cadena no estire y rompa la tela superior.
            let factorDureza = Math.max(1, Math.sqrt(filas / 15)); 
            let gravedadAplicadaX = gravedadX / factorDureza;
            let gravedadAplicadaY = gravedadY / factorDureza;

            for (let p of Puntos) {
                if (!p.fijo) {
                    if (estaTocando && !modoCorte) {
                        const distX = p.x - toqueX;
                        const distY = p.y - toqueY;
                        if (Math.hypot(distX, distY) < 80) {
                            p.x -= distX * 0.3; 
                            p.y -= distY * 0.3;
                        }
                    }

                    const velocX = Math.max(-50, Math.min(50, (p.x - p.viejoX) * 0.99));
                    const velocY = Math.max(-50, Math.min(50, (p.y - p.viejoY) * 0.99));

                    p.viejoX = p.x; 
                    p.viejoY = p.y;
                    
                    // Aplicamos la gravedad amortiguada
                    p.x += velocX + gravedadAplicadaX;
                    p.y += velocY + gravedadAplicadaY; 
                }
            }

            // Subimos las iteraciones a 10 para hacer que la malla sea extremadamente fuerte
            for (let iteracion = 0; iteracion < 10; iteracion++) {
                for (let enlace of Enlaces) {
                    if (!enlace.activo) continue;

                    const p1 = Puntos[enlace.p1];
                    const p2 = Puntos[enlace.p2];
                    const distX = p2.x - p1.x;
                    const distY = p2.y - p1.y;
                    
                    const distancia = Math.hypot(distX, distY) || 0.01; 

                    if (distancia > limiteEstiramiento) { enlace.activo = false; continue; }

                    if (estaTocando && modoCorte) {
                        const medioX = (p1.x + p2.x) / 2;
                        const medioY = (p1.y + p2.y) / 2;
                        if (Math.hypot(medioX - toqueX, medioY - toqueY) < 40) {
                            enlace.activo = false; continue;
                        }
                    }

                    // Fuerza de recuperación al 50% (Rigidez máxima segura para la matemática)
                    const fuerza = (espaciado - distancia) / distancia * 0.50;
                    
                    if (!p1.fijo) { p1.x -= distX * fuerza; p1.y -= distY * fuerza; }
                    if (!p2.fijo) { p2.x += distX * fuerza; p2.y += distY * fuerza; }
                }
            }

            if (modoRenderizado === 'alambre' && !imagenTela) {
                ctx.strokeStyle = `rgb(${colorBaseTela.r}, ${colorBaseTela.g}, ${colorBaseTela.b})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                for (let enlace of Enlaces) {
                    if (enlace.activo) {
                        const p1 = Puntos[enlace.p1];
                        const p2 = Puntos[enlace.p2];
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                    }
                }
                ctx.stroke();
            } else {
                let anchoImg = imagenTela ? imagenTela.width : 0;
                let altoImg = imagenTela ? imagenTela.height : 0;
                let pasoU = imagenTela ? anchoImg / (columnas - 1) : 0;
                let pasoV = imagenTela ? altoImg / (filas - 1) : 0;

                for (let y = 0; y < filas - 1; y++) {
                    for (let x = 0; x < columnas - 1; x++) {
                        const i = y * columnas + x;

                        const linkArriba = EnlacesH[i];
                        const linkDerecha = EnlacesV[i + 1];
                        const linkAbajo = EnlacesH[i + columnas];
                        const linkIzquierda = EnlacesV[i];

                        if (!linkArriba || !linkArriba.activo || 
                            !linkDerecha || !linkDerecha.activo || 
                            !linkAbajo || !linkAbajo.activo || 
                            !linkIzquierda || !linkIzquierda.activo) {
                            continue;
                        }

                        const p1 = Puntos[i];                 
                        const p2 = Puntos[i + 1];             
                        const p3 = Puntos[i + columnas + 1];      
                        const p4 = Puntos[i + columnas];          

                        if (imagenTela) {
                            let u0 = x * pasoU, v0 = y * pasoV;
                            let u1 = (x+1) * pasoU, v1 = y * pasoV;
                            let u2 = (x+1) * pasoU, v2 = (y+1) * pasoV;
                            let u3 = x * pasoU, v3 = (y+1) * pasoV;

                            mapearTextura(ctx, imagenTela, p1.x, p1.y, u0, v0, p2.x, p2.y, u1, v1, p3.x, p3.y, u2, v2);
                            mapearTextura(ctx, imagenTela, p1.x, p1.y, u0, v0, p3.x, p3.y, u2, v2, p4.x, p4.y, u3, v3);
                        } else {
                            const productoCruzado = (p2.x - p1.x) * (p4.y - p1.y) - (p2.y - p1.y) * (p4.x - p1.x);
                            const areaBase = espaciado * espaciado;
                            let sombra = (productoCruzado / areaBase) * 40; 
                            
                            let r = Math.max(0, Math.min(255, colorBaseTela.r + sombra - 20));
                            let g = Math.max(0, Math.min(255, colorBaseTela.g + sombra - 20));
                            let b = Math.max(0, Math.min(255, colorBaseTela.b + sombra - 20));

                            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                            ctx.strokeStyle = `rgb(${r}, ${g}, ${b})`; 
                            ctx.lineWidth = 0.8; 

                            ctx.beginPath();
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                            ctx.lineTo(p3.x, p3.y);
                            ctx.lineTo(p4.x, p4.y);
                            ctx.closePath();
                            
                            ctx.fill();
                            ctx.stroke();
                        }
                    }
                }
            }

            requestAnimationFrame(bucleAnimacion);
        }

        window.addEventListener('resize', () => {
            if (estaSimulando) {
                lienzo.width = window.innerWidth;
                lienzo.height = window.innerHeight;
            }
        });
    </script>
</body>
</html>
